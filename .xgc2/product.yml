schema: xgc2.product.v1
id: libxgc2-state-machine-dev
name: XGC2 State Machine
version: 0.2.0-1
kind: toolchain-apt
summary: Header-only C++17 value-state kernel for XGC2 controllers and planners.
apt:
  distribution: bionic,focal,jammy,noble
  install:
  - libxgc2-state-machine-dev
  packages:
  - libxgc2-state-machine-dev
  depends: []
usage:
  install: 'sudo apt update

    sudo apt install libxgc2-state-machine-dev

    '
  smoke_test: 'cmake --find-package -DNAME=xgc2_state_machine -DCOMPILER_ID=GNU -DLANGUAGE=CXX
    -DMODE=EXIST

    '
  notes: 'CMake consumers should use find_package(xgc2_state_machine 0.2.0 REQUIRED CONFIG)

    and link xgc2_state_machine::state_machine. The public include path remains

    <state_machine/adt_machine.hpp>.

    '
release:
  apt_versions:
    bionic: 0.2.0-1~bionic
    focal: 0.2.0-1~focal
    jammy: 0.2.0-1~jammy
    noble: 0.2.0-1~noble
ownership:
  paths:
  - /usr/include/state_machine
  - /usr/lib/*/cmake/xgc2_state_machine
conflicts:
  apt_packages:
  - ros-noetic-xgc2-state-machine
